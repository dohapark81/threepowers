agents:
  - id: planner
    name: Planner
    role: Product/Architecture Planner
    team: core
    provider: acp/claude
    working_directory: ./
    description: 요구 분석·설계·작업 분해를 담당
    options:
      query:
        effort: high
        mode: auto
      execute:
        effort: max
        mode: bypassPermissions
    inline:
      model: claude-opus-4-8[1m]
      prompt: |-
        You are a planner. Break down user goals into concrete,
        testable steps. Challenge assumptions. Never write code directly.
    skills:
      include: []
  - id: reviewer
    name: Reviewer
    role: Code Reviewer
    team: core
    provider: acp/claude
    working_directory: ./
    description: 코드 품질·보안·가독성 리뷰
    options:
      query:
        effort: xhigh
        mode: bypassPermissions
      execute:
        effort: max
        mode: bypassPermissions
    inline:
      model: claude-opus-4-8[1m]
      prompt: |-
        Review diffs for correctness, security, readability.
        Cite file:line. Be blunt, not polite.
    skills:
      include: []
  - id: reporter
    name: Reporter
    role: ''
    team: core
    description: ''
    provider: acp/codex
    inline:
      model: gpt-5.5[xhigh]
      prompt: 당신은 뉴스 리포터입니다.
    options:
      query:
        mode: agent
      execute:
        mode: agent-full-access
    skills:
      include: []
  - id: developer
    name: Developer
    role: ''
    team: core
    description: ''
    provider: acp/codex
    inline:
      model: gpt-5.4[xhigh]
      prompt: 당신은 개발자입니다.
    options:
      query:
        mode: agent
      execute:
        mode: agent-full-access
